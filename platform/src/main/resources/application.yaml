server:
  port: ${SERVER_PORT}

spring:
  application:
    name: 'SecBase'

  datasource:
    url: ${DATABASE_URL_INITIALS}://${DATABASE_DOMAIN}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: 'classpath:db/migration'

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

springdoc:
  swagger-cli:
    path: '/swagger-ui.html'
  api-docs:
    path: '/v3/api-docs'

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${JWT_EXPIRY_HOURS}