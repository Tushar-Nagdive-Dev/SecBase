server:
  port: 1095

spring:
  application:
    name: 'secbase'

  datasource:
    url: jdbc:postgresql://${DATABASE_DOMAIN_NAME}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATABASE_DRIVER_NAME}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: 'classpath:db/migration'

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

springdoc:
  swagger-cli:
    path: '/swagger-ui.html'
  api-docs:
    path: '/v3/api-docs'

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: ${EXPIRATION_HOURS}