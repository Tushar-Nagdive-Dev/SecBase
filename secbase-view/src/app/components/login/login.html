<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-br from-slate-900 via-purple-950 to-blue-950 p-4 font-sans antialiased">
  
  <!-- Ambient Glow -->
  <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
    <div class="absolute -top-[10%] left-[20%] h-[30rem] w-[30rem] rounded-full bg-blue-600/30 blur-[120px]"></div>
    <div class="absolute -bottom-[10%] right-[20%] h-[30rem] w-[30rem] rounded-full bg-purple-600/30 blur-[120px]"></div>
  </div>

  <!-- Glass Card -->
  <div class="relative z-10 w-full max-w-md rounded-3xl border border-white/10 bg-white/[0.04] p-8 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] backdrop-blur-xl sm:p-10">
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold tracking-tight text-white">Welcome Back</h2>
      <p class="mt-2 text-sm text-purple-200/70">Sign in to access your secure vault.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Unified Login ID Field (Username or Email) -->
      <div class="space-y-2">
        <label hlmLabel for="loginId" class="text-white/80">Username or Email</label>
        <input hlmInput 
               id="loginId" 
               formControlName="loginId" 
               type="text" 
               placeholder="johndoe or john@company.com" 
               class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-blue-500 focus:ring-blue-500/50 rounded-xl transition-all" />
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label hlmLabel for="password" class="text-white/80">Password</label>
          <a href="#" class="text-xs font-medium text-blue-400 hover:text-blue-300">Forgot password?</a>
        </div>
        <input hlmInput 
               id="password" 
               formControlName="password" 
               type="password" 
               placeholder="••••••••" 
               class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-purple-500 focus:ring-purple-500/50 rounded-xl transition-all" />
      </div>

      <!-- Submit Button -->
      <button hlmBtn 
              type="submit" 
              [disabled]="loginForm.invalid"
              class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 py-6 text-base font-semibold text-white shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:scale-[1.01] transition-all disabled:opacity-50 disabled:hover:scale-100">
        Sign In
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-white/60">
      Don't have an account? 
      <a routerLink="/auth/register" class="font-semibold text-blue-400 hover:text-blue-300 transition-colors">Create one now</a>
    </div>
  </div>
</div>
