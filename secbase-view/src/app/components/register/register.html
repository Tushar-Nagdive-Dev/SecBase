<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gradient-to-br from-slate-900 via-blue-950 to-purple-950 p-4 font-sans antialiased">
  
  <!-- Ambient Glow -->
  <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
    <div class="absolute -top-[10%] right-[20%] h-[30rem] w-[30rem] rounded-full bg-cyan-600/20 blur-[120px]"></div>
    <div class="absolute -bottom-[10%] left-[20%] h-[30rem] w-[30rem] rounded-full bg-blue-600/30 blur-[120px]"></div>
  </div>

  <!-- Glass Card -->
  <div class="relative z-10 w-full max-w-[28rem] rounded-3xl border border-white/10 bg-white/[0.04] p-8 shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] backdrop-blur-xl sm:p-10">
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-bold tracking-tight text-white">Create Account</h2>
      <p class="mt-2 text-sm text-blue-200/70">Join SECBASE and secure your infrastructure.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- Name Grid (First & Last Name side-by-side) -->
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label hlmLabel for="firstName" class="text-white/80">First Name</label>
          <input hlmInput id="firstName" formControlName="firstName" type="text" placeholder="John" class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-cyan-500 focus:ring-cyan-500/50 rounded-xl transition-all" />
        </div>
        <div class="space-y-2">
          <label hlmLabel for="lastName" class="text-white/80">Last Name</label>
          <input hlmInput id="lastName" formControlName="lastName" type="text" placeholder="Doe" class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-cyan-500 focus:ring-cyan-500/50 rounded-xl transition-all" />
        </div>
      </div>

      <!-- Username Field -->
      <div class="space-y-2">
        <label hlmLabel for="username" class="text-white/80">Username</label>
        <input hlmInput id="username" formControlName="username" type="text" placeholder="johndoe" class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-cyan-500 focus:ring-cyan-500/50 rounded-xl transition-all" />
      </div>

      <!-- Email Field -->
      <div class="space-y-2">
        <label hlmLabel for="email" class="text-white/80">Corporate Email</label>
        <input hlmInput id="email" formControlName="email" type="email" placeholder="john@company.com" class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-cyan-500 focus:ring-cyan-500/50 rounded-xl transition-all" />
      </div>

      <!-- Password Field -->
      <div class="space-y-2">
        <label hlmLabel for="password" class="text-white/80">Secure Password</label>
        <input hlmInput id="password" formControlName="password" type="password" placeholder="••••••••" class="w-full bg-black/20 border-white/10 text-white placeholder:text-white/30 focus:border-cyan-500 focus:ring-cyan-500/50 rounded-xl transition-all" />
      </div>

      <!-- Submit Button -->
      <button hlmBtn 
              type="submit" 
              [disabled]="registerForm.invalid"
              class="w-full rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 py-6 text-base font-semibold text-white shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-[1.01] transition-all disabled:opacity-50 disabled:hover:scale-100 mt-2">
        Create Account
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-white/60">
      Already have an account? 
      <a routerLink="/auth/login" class="font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">Sign in here</a>
    </div>
  </div>
</div>
