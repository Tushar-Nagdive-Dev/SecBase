<div class="relative border-4 border-black bg-white p-8 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] max-w-lg w-full mx-4">

  <!-- Offset Warning Badge -->
  <div class="absolute -top-5 left-6 bg-red-500 border-4 border-black px-4 py-1 text-white font-black uppercase tracking-widest shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
    Critical Warning
  </div>

  <h2 class="text-2xl font-black mt-4 mb-4 uppercase">Zero-Knowledge Architecture</h2>

  <p class="text-lg font-bold mb-8 leading-relaxed text-gray-800">
    SecBase does <span class="bg-yellow-300 px-1 border-2 border-black text-black">NOT</span> save your master password for <span class="font-black border-b-4 border-black">{{ data.profileName }}</span>.
    <br/><br/>
    If you lose this password, your cryptographic enclave is sealed forever. Data recovery is mathematically impossible.
  </p>

  <!-- Action Grid -->
  <div class="flex flex-col gap-4 sm:flex-row">
    <button (click)="close('DOWNLOAD')"
            class="flex-1 bg-cyan-400 border-4 border-black p-3 font-black uppercase hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
      Download PDF Backup
    </button>

    <button (click)="close('ACKNOWLEDGED')"
            class="flex-1 bg-red-500 text-white border-4 border-black p-3 font-black uppercase hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
      I Memorized It
    </button>
  </div>
</div>
