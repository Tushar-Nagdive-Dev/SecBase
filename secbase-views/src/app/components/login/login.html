<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-cyan-50 to-orange-50 p-4 relative overflow-hidden text-slate-900">

  <!-- Sketchy background accents -->
  <div class="absolute top-20 right-20 text-orange-200 opacity-60 text-8xl transform rotate-12 pointer-events-none">?</div>
  <div class="absolute bottom-20 left-20 text-cyan-200 opacity-60 text-9xl transform -rotate-12 pointer-events-none">!</div>

  <!-- The Login Card -->
  <mat-card class="w-full max-w-md p-6 md:p-8 z-10 bg-white border-2 border-black">

    <mat-card-header class="flex flex-col items-center text-center w-full mb-8">
      <div class="w-16 h-16 bg-cyan-200 rounded-full border-2 border-black flex items-center justify-center text-3xl mb-4 shadow-[2px_2px_0px_#000]">
        🔐
      </div>
      <mat-card-title class="text-4xl font-extrabold mb-2">Access SECBASE</mat-card-title>
      <mat-card-subtitle class="text-lg text-slate-600 font-semibold">Enter your secure enclave.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

        <mat-form-field appearance="outline" class="w-full">
          <mat-label class="font-bold">Username or Email</mat-label>
          <input matInput formControlName="loginId" placeholder="johndoe or john@secbase.org">
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label class="font-bold">Master Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="••••••••">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="py-6 text-xl font-bold bg-cyan-400 w-full mt-2">
          DECRYPT & ENTER
        </button>

      </form>
    </mat-card-content>

    <mat-card-actions class="justify-center mt-6 pb-4">
      <a routerLink="/auth/signup" class="text-slate-700 hover:text-orange-600 font-bold underline decoration-wavy underline-offset-4 transition-colors">
        No keys yet? Initialize an account.
      </a>
    </mat-card-actions>

  </mat-card>
</div>
