<div class="min-h-screen bg-gray-50 p-8 font-sans flex justify-center">

  <div class="w-full max-w-4xl bg-white border-8 border-black shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] flex flex-col">

    <div class="border-b-8 border-black p-8 bg-cyan-400 flex justify-between items-center">
      <div>
        <h1 class="text-5xl font-black uppercase tracking-tighter mb-2">Store New Secret</h1>
        <p class="font-bold text-gray-900 text-lg">Payloads are encrypted locally before transmission.</p>
      </div>
      <button [routerLink]="['/enclave', profileId]" type="button" class="bg-black text-white px-6 py-3 font-black uppercase hover:bg-gray-800 transition-colors border-4 border-transparent shadow-[4px_4px_0px_0px_rgba(0,0,0,0.3)]">
        Cancel
      </button>
    </div>

    <form [formGroup]="credentialForm" (ngSubmit)="onSubmit()" class="p-8 flex flex-col gap-10">

      <div>
        <label class="block font-black text-xl uppercase mb-4 text-gray-500">Asset Type</label>
        <div class="flex gap-6">
          <button type="button" (click)="setType('LOGIN')" [class.bg-yellow-300]="selectedType() === 'LOGIN'" [class.shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]]="selectedType() !== 'LOGIN'" [class.translate-y-1]="selectedType() === 'LOGIN'" [class.translate-x-1]="selectedType() === 'LOGIN'" class="flex-1 border-4 border-black p-6 font-black text-2xl uppercase hover:bg-yellow-200 transition-all bg-white">
            🔑 Login
          </button>
          <button type="button" (click)="setType('CARD')" [class.bg-magenta-400]="selectedType() === 'CARD'" [class.text-white]="selectedType() === 'CARD'" [class.shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]]="selectedType() !== 'CARD'" [class.translate-y-1]="selectedType() === 'CARD'" [class.translate-x-1]="selectedType() === 'CARD'" class="flex-1 border-4 border-black p-6 font-black text-2xl uppercase hover:bg-magenta-300 hover:text-black transition-all bg-white">
            💳 Card
          </button>
          <button type="button" (click)="setType('NOTE')" [class.bg-black]="selectedType() === 'NOTE'" [class.text-white]="selectedType() === 'NOTE'" [class.shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]]="selectedType() !== 'NOTE'" [class.translate-y-1]="selectedType() === 'NOTE'" [class.translate-x-1]="selectedType() === 'NOTE'" class="flex-1 border-4 border-black p-6 font-black text-2xl uppercase hover:bg-gray-800 hover:text-white transition-all bg-white">
            📝 Note
          </button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-8 border-b-4 border-dashed border-black pb-10">
        <div class="col-span-2">
          <label class="block font-black text-xl uppercase mb-2">Item Name</label>
          <input type="text" formControlName="name" placeholder="e.g., Production Database" class="w-full border-4 border-black p-4 text-2xl font-bold focus:outline-none focus:-translate-y-1 focus:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
        </div>
        <div class="col-span-2 md:col-span-1">
          <label class="block font-black text-xl uppercase mb-2">Description / Tags</label>
          <input type="text" formControlName="description" class="w-full border-4 border-black p-4 text-xl font-bold focus:outline-none focus:-translate-y-1 focus:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all">
        </div>
        <div class="col-span-2 md:col-span-1 flex items-end">
          <label class="flex items-center gap-4 cursor-pointer p-4 border-4 border-black w-full hover:bg-gray-100 transition-colors">
            <input type="checkbox" formControlName="isFavorite" class="w-6 h-6 border-2 border-black accent-yellow-400">
            <span class="font-black text-xl uppercase">Mark as Favorite ⭐</span>
          </label>
        </div>
      </div>

      @switch (selectedType()) {

      @case ('LOGIN') {
      <div formGroupName="login" class="space-y-8 bg-gray-50 border-4 border-black p-8">
        <div class="inline-block bg-black text-white px-4 py-2 font-black uppercase text-lg border-2 border-transparent -mt-12 mb-4">Web Credentials</div>

        <div class="grid grid-cols-2 gap-8">
          <div>
            <label class="block font-black uppercase mb-2">URL</label>
            <input type="text" formControlName="url" class="w-full border-4 border-black p-4 text-lg font-bold focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>
          <div>
            <label class="block font-black uppercase mb-2">Username / Email</label>
            <input type="text" formControlName="loginId" class="w-full border-4 border-black p-4 text-lg font-bold focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>
        </div>

        <div class="border-4 border-black p-6 bg-yellow-100">
          <label class="block font-black uppercase mb-2">Secure Password</label>
          <sec-secure-password-input formControlName="password"></sec-secure-password-input>
        </div>
      </div>
      }

      @case ('CARD') {
      <div formGroupName="card" class="space-y-8 bg-magenta-50 border-4 border-black p-8">
        <div class="inline-block bg-magenta-400 text-black border-4 border-black px-4 py-2 font-black uppercase text-lg -mt-12 mb-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">Payment Data</div>

        <div class="grid grid-cols-12 gap-6">
          <div class="col-span-12 md:col-span-8">
            <label class="block font-black uppercase mb-2">Card Number</label>
            <input type="text" formControlName="number" placeholder="0000 0000 0000 0000" class="w-full border-4 border-black p-4 font-mono text-2xl font-black focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>
          <div class="col-span-6 md:col-span-4">
            <label class="block font-black uppercase mb-2">Brand</label>
            <select formControlName="cardBrand" class="w-full border-4 border-black p-4 text-lg font-black uppercase appearance-none bg-white focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
              <option value="VISA">Visa</option>
              <option value="MASTERCARD">Mastercard</option>
              <option value="AMEX">Amex</option>
            </select>
          </div>

          <div class="col-span-12 md:col-span-6">
            <label class="block font-black uppercase mb-2">Cardholder Name</label>
            <input type="text" formControlName="cardholderName" class="w-full border-4 border-black p-4 text-lg font-bold uppercase focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>

          <div class="col-span-4 md:col-span-3">
            <label class="block font-black uppercase mb-2">Exp Month</label>
            <input type="text" formControlName="expiryMonth" placeholder="MM" maxlength="2" class="w-full border-4 border-black p-4 font-mono text-xl text-center focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>
          <div class="col-span-4 md:col-span-3">
            <label class="block font-black uppercase mb-2">Exp Year</label>
            <input type="text" formControlName="expiryYear" placeholder="YYYY" maxlength="4" class="w-full border-4 border-black p-4 font-mono text-xl text-center focus:outline-none focus:-translate-y-1 focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all">
          </div>

          <div class="col-span-12 bg-black p-6 flex gap-6 mt-4">
            <div class="flex-1">
              <label class="block font-black text-white uppercase mb-2">CVV</label>
              <input type="password" formControlName="cvv" maxlength="4" class="w-full border-4 border-transparent p-4 font-mono text-xl focus:outline-none focus:border-cyan-400">
            </div>
            <div class="flex-1">
              <label class="block font-black text-white uppercase mb-2">PIN</label>
              <input type="password" formControlName="pin" maxlength="6" class="w-full border-4 border-transparent p-4 font-mono text-xl focus:outline-none focus:border-cyan-400">
            </div>
          </div>
        </div>
      </div>
      }

      @case ('NOTE') {
      <div formGroupName="note" class="space-y-4">
        <label class="block font-black text-xl uppercase mb-2">Secure Content</label>
        <textarea formControlName="content" rows="10" placeholder="Type encrypted notes here..." class="w-full border-4 border-black p-6 font-mono text-lg font-bold bg-yellow-50 focus:outline-none focus:-translate-y-1 focus:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-all"></textarea>
      </div>
      }
      }

      <div class="mt-8">
        <button type="submit" [disabled]="credentialForm.invalid || loading.isLoading()" class="w-full bg-cyan-400 border-8 border-black p-6 text-3xl font-black uppercase tracking-widest hover:translate-x-[4px] hover:translate-y-[4px] hover:shadow-none shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading.isLoading() ? 'Encrypting...' : 'Seal & Save' }}
        </button>
      </div>

    </form>
  </div>
</div>
