<div class="flex flex-col gap-2">

  <div class="flex gap-0 border-4 border-black bg-white shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] relative transition-all focus-within:-translate-y-1 focus-within:translate-x-1 focus-within:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">

    <!-- Input Field -->
    <input
      [type]="isRevealed() ? 'text' : 'password'"
      [value]="value()"
      [disabled]="isDisabled()"
      (input)="onInput($event)"
      placeholder="Secret Password"
      class="flex-1 p-4 font-mono font-black text-xl bg-transparent outline-none disabled:bg-gray-200 disabled:text-gray-500 w-full"
    >

    <!-- Controls -->
    <div class="flex border-l-4 border-black">
      <button
        type="button"
        (click)="toggleReveal()"
        [disabled]="isDisabled()"
        class="px-4 font-black uppercase hover:bg-yellow-300 transition-colors border-r-4 border-black flex items-center justify-center min-w-[80px]"
        tabindex="-1">
        {{ isRevealed() ? 'Hide' : 'Show' }}
      </button>

      <button
        type="button"
        (click)="generatePassword()"
        [disabled]="isDisabled()"
        class="px-4 font-black uppercase bg-cyan-400 hover:bg-cyan-500 transition-colors flex items-center justify-center min-w-[120px]"
        tabindex="-1">
        Generate
      </button>
    </div>
  </div>

  <!-- Chunky Strength Meter -->
  <div class="flex gap-2 mt-2 h-4 w-full">
    <div class="flex-1 border-2 border-black transition-colors duration-300"
         [class.bg-red-500]="strengthScore() >= 1"
         [class.bg-gray-200]="strengthScore() < 1"></div>
    <div class="flex-1 border-2 border-black transition-colors duration-300"
         [class.bg-orange-400]="strengthScore() >= 2"
         [class.bg-gray-200]="strengthScore() < 2"></div>
    <div class="flex-1 border-2 border-black transition-colors duration-300"
         [class.bg-yellow-300]="strengthScore() >= 3"
         [class.bg-gray-200]="strengthScore() < 3"></div>
    <div class="flex-1 border-2 border-black transition-colors duration-300"
         [class.bg-green-500]="strengthScore() >= 4"
         [class.bg-gray-200]="strengthScore() < 4"></div>
  </div>

  <div class="flex justify-between text-xs font-black uppercase text-gray-600 px-1">
    <span>Weak</span>
    <span>Unbreakable</span>
  </div>

</div>
