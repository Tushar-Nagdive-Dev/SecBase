@if (loadingService.isLoading()) {
  <div class="fixed inset-0 z-[9999] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center transition-all">
    
    <!-- Hand-drawn Loader Card -->
    <div class="bg-white border-2 border-black p-8 flex flex-col items-center gap-4 shadow-[8px_8px_0px_#000]"
         style="border-radius: var(--sketch-border-radius-alt);">
      
      <!-- Spinning Icon -->
      <mat-icon class="animate-spin text-5xl text-orange-500 font-extrabold w-12 h-12">sync</mat-icon>
      
      <!-- Pulsing Text -->
      <h2 class="text-2xl font-extrabold text-slate-900 animate-pulse tracking-widest mt-2">
        PROCESSING...
      </h2>
      
    </div>
  </div>
}
